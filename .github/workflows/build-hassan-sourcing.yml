name: Build Hassan Sourcing APK

on:
  push:
    branches: [ "hassan-sourcing-v2" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build V2.4 native APK
        working-directory: HassanSourcingV23
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          APK="HassanSourcingV23/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          APKSIGNER="$(find /usr/local/lib/android/sdk/build-tools -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Hassan-Sourcing-V2.4-APK
          path: HassanSourcingV23/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
