name: Build Hassan Sourcing APK

on:
  push:
    branches: [ "hassan-sourcing-v2" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore Hassan Sourcing source
        shell: bash
        run: |
          rm -rf /tmp/hassan-sourcing
          mkdir -p /tmp/hassan-sourcing/project
          printf '%s' '' | base64 -d > /tmp/hassan-sourcing/source.zip
          unzip -q /tmp/hassan-sourcing/source.zip -d /tmp/hassan-sourcing/project
      - name: Build debug APK
        working-directory: /tmp/hassan-sourcing/project
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Hassan-Sourcing-V2.1-APK
          path: /tmp/hassan-sourcing/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
