name: Build Hassan Sourcing V3 APK

on:
  push:
    branches: [ hassan-sourcing-v3 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project
        run: |
          mkdir project
          unzip -q Hassan-Sourcing-Android-V3.zip -d project
      - name: Build debug APK
        run: gradle -p project :app:assembleDebug
      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Hassan-Sourcing-V3.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hassan-Sourcing-V3-apk
          path: Hassan-Sourcing-V3.apk
